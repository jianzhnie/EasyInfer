# ==============================================================================
# GLM-5.2 W8A8 共部署（1M 上下文）— 全局配置
# ==============================================================================
# 拓扑: 16 节点 × 8 卡 = 128 NPU | DP=16 TP=8 PCP1 DCP=8 EP=128 | MTP 3 tokens
#   每节点 1 个 DP rank（原生多节点 DP，非 Ray）；
#   rank0 (DP master) 带 API，其余 rank --headless，入口 = DP_ADDRESS:VLLM_PORT
# 节点: nodes/node_list0.txt (10.42.11.194-209)
#
# 改跑 8 节点（EP=64）: NODES 改为 node_list3.txt (194-201)、DP_SIZE=8 即可，其余通用。
#
# 约束备忘（实测）：
#   - TP×PP ≤ 8/节点（vLLM v1 按本机枚举设备）→ TP=8 上限
#   - DCP>1 强制 FLASHCOMM1=1；W8A8 下 FUSED_MC2 触发 aclnnDispatchFFNCombine → 关
#   - EP=128 → 2 专家/卡（~6G，较 EP=64 省 ~6G/卡给 KV）
#   - util 0.85 上限：0.90 时 chunk prefill 的 MoE dispatch 瞬时 buffer OOM（实测）
#   - batched 8192 上限：EP=128 时 16384 chunk 的 dispatch buffer ~5.6G OOM（实测）
# ==============================================================================

SSH_USER=root
SSH_PORT=22
SSH_CONNECT_TIMEOUT=10

CONTAINER_NAME=vllm-ascend-env
REMOTE_SCRIPT_DIR=/home/jianzhnie/llmtuner/llm/EasyInfer/examples/glm-5.2_w8a8/dp1m

MODEL_PATH="/home/jianzhnie/llmtuner/hfhub/models/Eco-Tech/GLM-5.2-w8a8"
NIC_NAME="enp66s0f0"
LOG_DIR="/home/jianzhnie/llmtuner/llm/EasyInfer/logs"

# ---- 共部署: DP=16 TP=8 (1实例×8卡/节点) ----
DP_SIZE=16
TP_SIZE=8
DP_SIZE_LOCAL=1
DP_RPC_PORT=16591
VLLM_PORT=8007

NODES=("10.42.11.194" "10.42.11.195" "10.42.11.196" "10.42.11.197"
       "10.42.11.198" "10.42.11.199" "10.42.11.200" "10.42.11.201"
       "10.42.11.202" "10.42.11.203" "10.42.11.204" "10.42.11.205"
       "10.42.11.206" "10.42.11.207" "10.42.11.208" "10.42.11.209")
DP_ADDRESS="10.42.11.194"      # DP master = NODES[0]，API 入口

HEALTH_CHECK_TIMEOUT=2400
HEALTH_CHECK_INTERVAL=15
CLEAN_BEFORE_DEPLOY=false
