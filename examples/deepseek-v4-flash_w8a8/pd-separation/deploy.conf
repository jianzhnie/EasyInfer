# ==============================================================================
# DeepSeek-V4-Flash PD 分离部署 — 全局配置文件
# ==============================================================================
# 官方 §5.2 A2 PD: 4×PNode + 4×DNode
# P: DP=8 TP=1 (kv_producer)  D: DP=32 TP=1 (kv_consumer)
# ==============================================================================

# ---- SSH 连接（远程部署用）--------------------------------------------------
SSH_USER=root
SSH_PORT=22
SSH_CONNECT_TIMEOUT=10

# ---- Docker 容器 -----------------------------------------------------------
CONTAINER_NAME=vllm-ascend-env

# ---- 远程路径 ---------------------------------------------------------------
REMOTE_SCRIPT_DIR=/home/jianzhnie/llmtuner/llm/EasyInfer/examples/deepseek-v4-flash_w8a8/pd-separation

# ---- 通用参数 ---------------------------------------------------------------
MODEL_PATH="/home/jianzhnie/llmtuner/hfhub/models/Eco-Tech/DeepSeek-V4-Flash-w8a8-mtp"
NIC_NAME="enp66s0f0"
LOG_DIR="/home/jianzhnie/llmtuner/llm/EasyInfer/logs"

# ---- Prefill 节点 (PNode / kv_producer) ------------------------------------
# 4×PNode, DP=8 TP=4 (每节点 2 实例 × 4 NPU)
P_DP_SIZE=8
P_TP_SIZE=4
P_DP_SIZE_LOCAL=2
P_DP_RPC_PORT=12321
P_VLLM_START_PORT=7100

# ---- Decode 节点 (DNode / kv_consumer) -------------------------------------
# 4×DNode, DP=4 TP=4 (每节点 1 实例 × 4 NPU, TP_P(4) >= TP_D(4))
D_DP_SIZE=4
D_TP_SIZE=4
D_DP_SIZE_LOCAL=1
D_DP_RPC_PORT=12321
D_VLLM_START_PORT=7100

# ---- Prefill 节点列表 (4 台) ------------------------------------------------
P_IPS=(
    "10.42.11.194"
    "10.42.11.195"
    "10.42.11.196"
    "10.42.11.197"
)
P_DP_ADDRESS="10.42.11.194"

# ---- Decode 节点列表 (4 台) -------------------------------------------------
D_IPS=(
    "10.42.11.198"
    "10.42.11.199"
    "10.42.11.200"
    "10.42.11.201"
)
D_DP_ADDRESS="10.42.11.198"
D_RANK_STARTS=(0 1 2 3)

# ---- 健康检查 ---------------------------------------------------------------
HEALTH_CHECK_TIMEOUT=120
HEALTH_CHECK_INTERVAL=10

# ---- 流程控制 ---------------------------------------------------------------
CLEAN_BEFORE_DEPLOY=false
