# ==============================================================================
# DeepSeek-V4-Flash PD 分离部署 — 全局配置文件
# ==============================================================================
# 官方文档 §5.2 A2 PD 分离: 4×PNode + 4×DNode
# P: DP=8 TP=1 (kv_producer)  D: DP=32 TP=1 (kv_consumer)
# ==============================================================================

# ---- SSH 连接（远程部署用）--------------------------------------------------
SSH_USER=root
SSH_PORT=22
SSH_KEY=~/.ssh/id_rsa
SSH_CONNECT_TIMEOUT=10

# ---- 远程路径 ---------------------------------------------------------------
# 共享存储路径（所有节点统一）
REMOTE_SCRIPT_DIR=/home/jianzhnie/llmtuner/llm/EasyInfer/examples/deepseek-v4-flash_w8a8/pd-separation

# ---- 通用参数 ---------------------------------------------------------------
MODEL_PATH="/home/jianzhnie/llmtuner/hfhub/models/Eco-Tech/DeepSeek-V4-Flash-w8a8-mtp"
NIC_NAME="enp66s0f0"
LOG_DIR="/home/jianzhnie/llmtuner/llm/EasyInfer/logs"
SERVED_MODEL_NAME="dsv4"

# ---- Prefill 节点（PNode / kv_producer）--------------------------------------
PREFILL_DP_SIZE=8
PREFILL_TP_SIZE=1
PREFILL_DP_SIZE_LOCAL=8
PREFILL_DP_RPC_PORT=12321
PREFILL_VLLM_START_PORT=7100

# ---- Decode 节点（DNode / kv_consumer）---------------------------------------
DECODE_DP_SIZE=32
DECODE_TP_SIZE=1
DECODE_DP_SIZE_LOCAL=8
DECODE_DP_RPC_PORT=12321
DECODE_VLLM_START_PORT=7100

# ---- Prefill 节点列表（4 台）------------------------------------------------
PREFILL_NODE_IPS=(
    "10.0.0.1"
    "10.0.0.2"
    "10.0.0.3"
    "10.0.0.4"
)
PREFILL_DP_ADDRESS="10.0.0.1"

# ---- Decode 节点列表（4 台）--------------------------------------------------
DECODE_NODE_IPS=(
    "10.0.0.5"
    "10.0.0.6"
    "10.0.0.7"
    "10.0.0.8"
)
DECODE_DP_ADDRESS="10.0.0.5"
DECODE_NODE_RANK_STARTS=(0 8 16 24)

# ---- 健康检查 ---------------------------------------------------------------
HEALTH_CHECK_TIMEOUT=600
HEALTH_CHECK_INTERVAL=10

# ---- 流程控制 ---------------------------------------------------------------
CLEAN_BEFORE_DEPLOY=true
